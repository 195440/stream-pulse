<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080b12'/%3E%3Cpath d='M8 35h11l6-17 10 31 7-18h14' fill='none' stroke='%2357f3ff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>StreamPulse Offline Demo</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/overlay.css">
</head>
<body class="demo-page">
  <header class="demo-toolbar">
    <div class="brand-lockup"><span class="brand-mark" aria-hidden="true"></span><span>Offline demo</span></div>
    <div class="speed-control" role="group" aria-label="Demo speed">
      <button type="button" data-speed="1" aria-pressed="false">1x</button>
      <button type="button" data-speed="4" aria-pressed="true">4x</button>
      <button type="button" data-speed="8" aria-pressed="false">8x</button>
    </div>
  </header>
  <main class="demo-stage">
    <section class="stream-scene" aria-label="Simulated game stream backdrop">
      <div class="stream-meta"><strong>LIVE</strong><span>● 1,284</span></div>
      <div class="game-hud" aria-hidden="true">
        <span>ROUND 03</span><strong>02:14</strong><span>OBJECTIVE B</span>
      </div>
      <div class="scene-ridge scene-ridge-back" aria-hidden="true"></div>
      <div class="scene-ridge scene-ridge-front" aria-hidden="true"></div>
      <div class="scene-platform" aria-hidden="true"></div>
      <div class="scene-player" aria-hidden="true"><span></span></div>
      <div class="scene-reticle" aria-hidden="true"></div>
    </section>
    <aside class="demo-chat" aria-label="Simulated Twitch chat">
      <header><strong>STREAM CHAT</strong><span>Community</span></header>
      <div class="demo-chat-feed" id="demo-chat-feed" aria-live="off"></div>
      <footer>Chat is moving fast</footer>
    </aside>
    <div class="overlay-root" id="overlay" data-corner="br" data-demo="true">
      <section class="pulse-card" aria-label="Simulated chat pulse">
        <div class="pulse-heading">StreamPulse</div>
        <div class="pulse-status" aria-live="polite">
          <span class="status-dot" id="status-dot" data-status="demo"></span>
          <span id="status-text">Demo live</span>
        </div>
        <div><span class="pulse-value" id="pulse-value">0</span><span class="pulse-unit">msg / 5s</span></div>
        <div class="chatter-count"><strong id="chatter-count">0</strong><br>chatters</div>
        <canvas class="pulse-canvas" id="pulse-canvas" aria-label="Recent simulated chat rate sparkline"></canvas>
      </section>
      <section class="moment-banner" id="moment-banner" role="status" aria-live="assertive" aria-atomic="true">
        <span class="moment-kicker">Moment detected</span>
        <strong class="moment-label" id="moment-label">Chat exploded</strong>
        <span class="moment-time" id="moment-time">00:00</span>
      </section>
      <section class="mark-toast" id="mark-toast" role="status" aria-live="assertive" aria-atomic="true">
        <span class="mark-icon" aria-hidden="true">◆</span>
        <span>Community mark <strong id="mark-count">3</strong> chatters</span>
      </section>
      <div class="rain-layer" id="rain-layer" aria-hidden="true"></div>
    </div>
  </main>
  <p class="demo-caption">Synthetic chat - no Twitch connection</p>
  <script type="module" src="js/ui-overlay.js"></script>
</body>
</html>
